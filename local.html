<head>
  <link href="video-js.css" rel="stylesheet" />
  <link href="video-js.min.css" rel="stylesheet" />
  <link href="index.css" rel="stylesheet" />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      /* background: #000000; */
    }

    p {
      margin-left: 10pt;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    #my-video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }

    #centered {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 2.5rem;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div id="main-section">
    <div id="video-elem" hidden>
      <video id="my-video" class="video-js vjs-theme-fantasy" controls preload="auto">
        <p class="vjs-no-js">
          To view this video please enable JavaScript, and consider upgrading to a
          web browser that
          <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
        </p>
      </video>
    </div>

    <p>
      Download <a id="video-url" href="" target="_blank"></a> video
    </p>

    <p>
      If not working, <a href="local.html#" id="try-local-button">try without external js/css</a>c
    </p>
  </div>

  <div id="no-url-section" hidden>
    <div id="centered" hidden>
      <center>
        Append <code>#</code> and a video file url to current page to watch it, like
        <code>#https://my.video/file.mov</code>
      </center>
    </div>
  </div>

  <script src="video.min.js"></script>

  <script>
    const url = window.top.location.hash.substr(1);
    const params = new URLSearchParams(window.top.location.search);

    const videoUrlElement = document.getElementById("video-url");
    videoUrlElement.setAttribute("href", url);
    videoUrlElement.textContent = url;

    const tryLocalButtonElement = document.getElementById("try-local-button");
    tryLocalButtonElement.setAttribute("href", tryLocalButtonElement.getAttribute("href") + url);

    function applyInitialPosition(player) {
      const timeParam = params.get('t');

      if (timeParam !== null) {
        const seconds = Number(timeParam);
        if (!Number.isNaN(seconds) && seconds >= 0) {
          player.currentTime(seconds);
        }
      }
    }

    function startTimeUrlSync(player) {
      let lastSyncedSecond = null;

      function syncCurrentTimeToUrl() {
        const currentSecond = Math.floor(player.currentTime());
        if (currentSecond === lastSyncedSecond) {
          return;
        }

        lastSyncedSecond = currentSecond;

        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set('t', String(currentSecond));
        window.history.replaceState(null, '', nextUrl.toString());
      }

      window.setInterval(() => {
        if (player.paused()) {
          return;
        }

        syncCurrentTimeToUrl();
      }, 1000);

      player.on('seeked', syncCurrentTimeToUrl);
      player.on('pause', syncCurrentTimeToUrl);
    }

    if (url != "") {
      console.log("Video url found");
      window.addEventListener("load", (event) => {
        console.log("page loaded");
        const player = videojs('my-video');
        player.src(url);
        player.one('loadedmetadata', () => {
          applyInitialPosition(player);
          startTimeUrlSync(player);
        });

        const noUrlSection = document.getElementById('video-elem');
        noUrlSection.removeAttribute("hidden");
      });
    } else {
      console.log("No url found");

      const mainSection = document.getElementById("main-section");
      mainSection.setAttribute("hidden", true);

      const noUrlSection = document.getElementById("no-url-section");
      noUrlSection.removeAttribute("hidden");
    }
  </script>
</body>
